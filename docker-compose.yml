version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: paintingbuddy-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: paintingbuddy
      POSTGRES_PASSWORD: paintingbuddy123
      POSTGRES_DB: paintingbuddy
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paintingbuddy"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
